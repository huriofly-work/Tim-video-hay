version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /native/TimVideoHay.Core
      - /native/TimVideoHay.Infrastructure
      - /native/TimVideoHay.Desktop
      - /native/TimVideoHay.Tests
    schedule:
      interval: weekly
    # Chỉ đề xuất bản đã phát hành ít nhất 14 ngày; cập nhật bảo mật không bị chờ.
    cooldown:
      default-days: 14
    groups:
      nuget:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
